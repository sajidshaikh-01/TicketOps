server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Don't let the runtime-generated config.js get cached - it can change
    # every time the container restarts with different env vars, and a
    # stale cached copy would silently point the app at the wrong backend.
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Hashed, content-addressed build assets (Vite outputs filenames like
    # index-DugoKQuX.js) are safe to cache aggressively/immutably - a
    # content change always produces a new filename.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: any path that isn't a real file (e.g. /events/abc-123,
    # /admin/bookings) falls back to index.html so React Router can handle
    # client-side routing instead of Nginx 404-ing on a direct URL visit or refresh.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # Lightweight gzip - the SPA bundle benefits noticeably from this.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
